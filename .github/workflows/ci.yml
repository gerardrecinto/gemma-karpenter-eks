name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kubeconform and test dependencies
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          pip install pytest pyyaml

      - name: Validate Terraform, schema-check manifests, run tests
        run: scripts/validate.sh

  terragrunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          sudo curl -fsSL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64
          sudo chmod +x /usr/local/bin/terragrunt

      - name: Format check, then validate every environment
        working-directory: live
        env:
          TG_LOCAL_STATE: "1"
        run: |
          terragrunt hcl fmt --check
          terragrunt run --all --non-interactive -- validate

  pulumi-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test against Pulumi mocks
        working-directory: pulumi/python
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q -W ignore

  pulumi-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: pulumi/go/go.mod
          cache-dependency-path: pulumi/go/go.sum

      - name: Vet and test against Pulumi mocks
        working-directory: pulumi/go
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./... -count=1
