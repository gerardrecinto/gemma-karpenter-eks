# General purpose capacity for anything that is not a GPU workload.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Spot and on-demand. Karpenter prefers the cheaper spot offering and
        # falls back to on-demand when spot has no capacity.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Several families and sizes, not one. A wide choice gives the spot
        # allocator more pools to pick from, which lowers interruption risk, and
        # lets Karpenter pick the size that fits the pending pods.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
      # Replace nodes after 30 days so they pick up new AMIs and patches.
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
  # A hard ceiling. A bug that creates pods in a loop stops here, not at the account limit.
  limits:
    cpu: "64"
    memory: 256Gi
